name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      #Sur un tag v1.2.3, la version du jar devient 1.2.3
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-PreleaseVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaHeight
          path: build/libs/DeltaHeight.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/DeltaHeight.jar
          generate_release_notes: true
